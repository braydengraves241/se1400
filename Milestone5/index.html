<!DOCTYPE HTML>
<html>

<head>
    <link rel='Stylesheet' href="style.css">
</head>

<body>


    <header>
        <h1>Welcome!</h1>
        <nav>
            <a>Reading</a>

            <a>Ratings</a>

            <a>TBR</a>

            <a>Clubs</a>
        </nav>




    </header>
    <article>
        <div class="shelf left-column">
            <div class="span">
                <h3>Currently Reading</h3>
                <div class="line"></div>
                <p>Log a reading session here!</p>
            </div>
            <img/>
        </div>
        <div class="shelf right-column">
            <div class="span">
                <h3>Ratings</h3>
                <div class="line"></div>
                <p>Books you've reviewed will appear here!</p>
            </div>
            <img>
        </div>
        <div class="shelf left-column">
            <div class="span">
                <h3>To Be Read</h3>
                <div class="line"></div>
                <p>Add books you would like to read here!</p>
            </div>
            <img>
        </div>
        <div class="shelf right-column">
            <div class="span">
                <h3>Book Clubs</h3>
                <div class="line"></div>
                <p>Join a book club here!</p>
            </div>
            <img/>
        </div>

    </article>

    <footer>

    </footer>

</body>

</html>
